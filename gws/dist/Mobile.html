<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1d1d1f; --sub:#6b6b70; --line:#e4e2dd;
  --accent:#1f6feb; --accent-soft:#e6efff; --done:#2e7d32; --later:#b26a00; --skip:#8a8a90;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141416; --card:#1f1f22; --ink:#f1f1f3; --sub:#a0a0a8; --line:#2f2f34;
    --accent:#6ea8ff; --accent-soft:#1d2b45; --done:#7ccf82; --later:#f0b35a; --skip:#77777f; }
}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.55;
  padding-bottom:max(80px,env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:3;background:var(--bg);padding:12px 16px 0;
  padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 0 4px}
h1 small{font-weight:400;color:var(--sub);font-size:13px;margin-left:6px}
.hint{font-size:12px;color:var(--sub);margin:0 0 6px}
nav{display:flex;gap:4px}
nav button{flex:1;border:0;background:none;color:var(--sub);font:inherit;font-size:14px;padding:10px 4px;
  border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
main{padding:12px 16px;display:grid;gap:12px;max-width:720px;margin:0 auto}
.slot{position:relative;border-radius:14px;overflow:hidden;transition:height .22s ease, margin .22s ease, opacity .22s ease}
.under{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;
  font-weight:700;font-size:15px;color:#fff;border-radius:14px}
.under .l,.under .r{opacity:0;transition:opacity .1s, transform .12s}
.slot.toL .under{background:var(--skip)} .slot.toL .under .r{opacity:.55}
.slot.toR .under{background:var(--later)} .slot.toR .under .l{opacity:.55}
.slot.toR.done .under{background:var(--done)}
.under{filter:saturate(.45) brightness(1.08);transition:filter .12s}
.slot.armed .under{filter:none}
.slot.armed .under .l,.slot.armed .under .r{opacity:1;transform:scale(1.15)}
.under small{display:block;font-size:11px;font-weight:400;opacity:.9}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
  touch-action:pan-y;will-change:transform}
.card.anim{transition:transform .2s ease-out}
.meta{font-size:12px;color:var(--sub);display:flex;gap:8px;flex-wrap:wrap}
.score{color:var(--accent);font-weight:700}
.card a.title{display:block;color:var(--ink);text-decoration:none;font-weight:700;font-size:16px;margin:4px 0 6px}
.sum{font-size:14px;color:var(--sub);margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.by{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 2px;font-size:15px;font-weight:700;color:var(--ink)}
.by::before{content:"✍";font-weight:400;color:var(--accent)}
.orig{font-size:12px;color:var(--sub);margin:-4px 0 6px}
.about{font-size:12px;color:var(--sub);background:var(--accent-soft);border-radius:8px;padding:6px 8px;margin:6px 0 2px}
.words{font-size:13px;margin-bottom:10px}
.words b{color:var(--accent);font-weight:700}
.rate{display:flex;align-items:center;gap:6px;margin:6px 0}
.rate span{font-size:12px;color:var(--sub);width:3.2em}
.rate button{width:38px;height:36px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--ink);font:inherit;cursor:pointer}
.rate button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{flex:1;height:40px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.acts button.skip{color:var(--sub)}
.acts button.on{font-weight:700;border-color:currentColor}
.acts button.later.on{color:var(--later)} .acts button.done.on{color:var(--done)}
.rep{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;border-radius:999px;padding:0 8px;line-height:20px;
  border:1px solid currentColor;white-space:nowrap}
.rep.good{color:var(--done)} .rep.bad{color:#c62828} .rep.mid{color:var(--sub)}
@media (prefers-color-scheme: dark){ .rep.bad{color:#ff8a80} }
.rep i{font-style:normal;font-size:13px}
.age.fresh{color:var(--done);font-weight:700} .age.old{color:#c62828;font-weight:700}
@media (prefers-color-scheme: dark){ .age.old{color:#ff8a80} }
.kind{font-size:11px;border-radius:6px;padding:0 6px;line-height:20px;background:var(--line);color:var(--sub)}
.kind.stale{background:#c62828;color:#fff} .kind.keep{background:var(--accent-soft);color:var(--accent)}
.slot.isStale .card{opacity:.6}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
#addBtn{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:999px;font:inherit;font-size:13px;font-weight:700;padding:4px 12px;cursor:pointer;white-space:nowrap}
#addForm{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:4px 0 8px}
#addForm p{font-size:12px;color:var(--sub);margin:0 0 8px}
#addForm .row{display:flex;gap:8px}
#addUrl{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;font-size:16px;background:var(--bg);color:var(--ink)}
#addGo{height:40px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:700;padding:0 16px}
#addGo:disabled{opacity:.5}
.pin{font-size:11px;border-radius:6px;padding:0 6px;line-height:20px;background:var(--accent);color:#fff}
.suggest .card{border:2px solid var(--accent)}
.dot{color:var(--accent);font-size:10px;vertical-align:super}
.sg-head{font-size:12px;font-weight:700;color:var(--accent)}
.sg-text{margin:6px 0 4px;font-size:15px}
.sg-hint{font-size:11px;color:var(--sub);margin:8px 0 0}
.acts button.sg-yes{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.author .ahead{display:flex;align-items:center;gap:8px}
.author .ahead b{font-size:16px}
.author .more{margin-left:auto;font-size:12px;color:var(--accent)}
.aview{font-size:13px;color:var(--sub);margin:4px 0 8px}
.mhead{padding:0 15px;margin-bottom:-6px!important}
.arow,.mhead{display:flex;align-items:center;gap:8px;margin:4px 0}
.ach{width:5.2em;font-size:12px;color:var(--sub);flex:none}
.strip{display:flex;gap:3px;flex:none}
.strip i{width:16px;height:16px;border-radius:4px;background:var(--line)}
.strip i.g{background:var(--done)} .strip i.r{background:#c62828} .strip i.n{background:var(--sub)}
.strip i.v{background:var(--accent)} .strip i.v.z{background:var(--line)}
.rep.vw{color:var(--accent)}
.nofeed{margin-left:auto;font-size:11px;color:var(--sub);border:1px dashed var(--line);border-radius:6px;padding:0 6px}
.strip i.l1{opacity:.45} .strip i.l2{opacity:.7} .strip i.l3{opacity:1} .strip i.z{opacity:1}
.mhead .strip em{width:16px;font-size:9px;font-style:normal;color:var(--sub);text-align:center;letter-spacing:-.05em}
.arow select{margin-left:auto;font:inherit;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:2px 4px;background:var(--card);color:var(--ink)}
.arow select.f-focus{border-color:var(--done);color:var(--done);font-weight:700}
.arow select.f-less{border-color:var(--later);color:var(--later)}
.arow select.f-mute{border-color:#c62828;color:#c62828}
.adetail{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-size:13px}
.adetail p{margin:4px 0} .adetail ul{margin:2px 0 6px;padding-left:18px}
.adetail label{display:block;font-size:12px;color:var(--sub);margin:8px 0 2px}
.adetail textarea,.adetail input{display:block;width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--bg);color:var(--ink);margin-top:4px}
.adetail .auto{font-size:12px;color:var(--sub)}
.adetail button{margin-top:6px;height:36px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:700;padding:0 16px}
.empty,.msg{text-align:center;color:var(--sub);padding:40px 0;font-size:14px}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120%);
  display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;
  font-size:14px;opacity:0;pointer-events:none;transition:opacity .15s, transform .15s;z-index:5;max-width:calc(100% - 32px);width:max-content;border-radius:16px}
.toast.show{opacity:.95;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toastText{overflow:hidden;text-overflow:ellipsis}
.toast button{border:0;background:none;color:var(--accent);font:inherit;font-weight:700;padding:4px 0;cursor:pointer}
@media (prefers-color-scheme: dark){ .toast button{color:#1f6feb} }
</style>
</head>
<body>
<header>
  <div class="top"><h1>RSS学習ログ<small id="who"></small></h1><button id="addBtn" type="button">＋ URLを貼る</button></div>
  <form id="addForm" hidden>
    <p>気になった記事やYouTubeのURLを貼ると、読んだ記事として「興味5・重要5」で残し、その人と媒体を注目に加えて興味の重みを更新します。</p>
    <div class="row"><input id="addUrl" type="url" inputmode="url" placeholder="https://..." autocomplete="off"><button id="addGo" type="submit">追加</button></div>
  </form>
  <p class="hint" id="hint"></p>
  <nav>
    <button data-v="new" class="on">新着 <span id="cNew"></span></button>
    <button data-v="later">あとで <span id="cLater"></span></button>
    <button data-v="rated">評価済み</button>
    <button data-v="authors">著者 <span id="cAuth" class="dot"></span></button>
  </nav>
</header>
<main id="list"><div class="msg">読み込み中…</div></main>
<div class="toast" id="toast"><span id="toastText"></span><button id="undo" type="button">元に戻す</button></div>
<script>
var USER = <?= JSON.stringify(user) ?>;
var view = 'new';
var items = [];
var counts = { new: 0, later: 0 };
var lastMove = null;   // 元に戻す用 { a, index, prevStatus, prevInterest }
var toastTimer = 0;
var swiped = false;    // スワイプ直後のリンクの誤タップを止める

// 画面ごとのスワイプ。右＝前向き、左＝興味なし。
var SWIPE = {
  new:   { right: { status: 'あとで読む', label: 'あとで読む' }, left: { status: '興味なし', label: '興味なし' } },
  // あとで: 右＝興味はあるが読まない（興味4・重要2を自動で付けて片付ける。数字を付けてあればそのまま）
  later: { right: { status: '完了', label: '興味あり・読まない', interest: 4, importance: 2 }, left: { status: '興味なし', label: '興味なし' } }
};
var HINTS = {
  new: '右へスワイプ＝あとで読む　左へ＝興味なし',
  later: '右へ＝興味あり・読まない（興味4・重要2が付きます）　左へ＝興味なし　自分で付けたいときは数字を押す',
  rated: 'ここでは数字を直せます',
  authors: '最近ハマっている順。色は月ごとの当たり（緑＝刺さった、赤＝外れ、灰＝見ただけ、青＝YouTubeで見た本数）'
};
var suggest = null;
var authorData = null;
var openAuthor = '';

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
// 年つきの日付と「何日前」。ニュース型で古いものは灰色の「古いニュース」、保存型は「古くても役立つ型」
function day(a){
  var ms = a.published; if (!ms) return '<span class="age">日付なし</span>';
  var d = new Date(ms), days = Math.floor((Date.now() - ms) / 86400000);
  var ago = days < 1 ? '今日' : days < 31 ? days + '日前' : days < 365 ? Math.floor(days / 30) + 'か月前' : Math.floor(days / 365) + '年以上前';
  var cls = days < 8 ? 'fresh' : days < 365 ? 'mid' : 'old';
  var tag = a.kind === 'news' ? (a.stale ? '<span class="kind stale">古いニュース</span>' : '<span class="kind">ニュース</span>')
    : (days > 30 ? '<span class="kind keep">古くても役立つ型</span>' : '');
  return '<span class="age ' + cls + '">' + d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate() + '（' + ago + '）</span>' + tag;
}

function toast(text, withUndo){
  $('toastText').textContent = text;
  $('undo').style.display = withUndo ? '' : 'none';
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ $('toast').classList.remove('show'); lastMove = null; }, withUndo ? 7000 : 3800);
}

function showCounts(){
  $('cAuth').textContent = suggest ? '●' : '';
  $('cNew').textContent = counts.new ? '(' + counts.new + ')' : '';
  $('cLater').textContent = counts.later ? '(' + counts.later + ')' : '';
}

function load(){
  $('hint').textContent = HINTS[view];
  $('list').innerHTML = '<div class="msg">読み込み中…</div>';
  if (view === 'authors') {
    google.script.run.withSuccessHandler(function(res){ authorData = res; suggest = res.suggest || null; showCounts(); renderAuthors(); })
      .withFailureHandler(function(e){ $('list').innerHTML = '<div class="msg">読み込めませんでした: ' + esc(e.message) + '</div>'; })
      .apiAuthors(USER);
    return;
  }
  google.script.run.withSuccessHandler(function(res){
    items = res.items; counts = res.counts; suggest = res.suggest || null; linkRep();
    $('who').textContent = res.name ? res.name + ' さん' : '';
    showCounts(); render();
  }).withFailureHandler(function(e){
    $('list').innerHTML = '<div class="msg">読み込めませんでした: ' + esc(e.message) + '</div>';
  }).apiArticles(USER, view);
}

function rateRow(a, field, label){
  var cur = field === '興味度' ? a.interest : a.importance;
  var h = '<div class="rate"><span>' + label + '</span>';
  for (var i = 1; i <= 5; i++) h += '<button data-f="' + field + '" data-v="' + i + '" class="' + (cur === i ? 'on' : '') + '">' + i + '</button>';
  return h + '</div>';
}

function cardHtml(a){
  var sw = SWIPE[view];
  return '<div class="slot' + (a.stale ? ' isStale' : '') + '" data-id="' + esc(a.id) + '">' +
    (sw ? '<div class="under"><span class="l">' + sw.right.label + ' →<small>離すと決定</small></span><span class="r">← ' + sw.left.label + '<small>離すと決定</small></span></div>' : '') +
    '<article class="card">' +
      '<div class="meta"><span>' + esc(a.source) + '</span>' + repBadge(a.src, '媒体') + day(a) + (a.score ? '<span class="score">関連度 ' + a.score + '</span>' : '') + '</div>' +
      (a.author && a.author !== a.source ? '<div class="by">' + esc(a.author) + ' ' + repBadge(a.who, '人') + '</div>' : '') +
      (a.about ? '<div class="about">' + esc(a.about) + '</div>' : '') +
      (a.pinned ? '<span class="pin">自分で追加</span>' : '') +
      '<a class="title" href="' + esc(a.link) + '" target="_blank" rel="noopener">' + esc(a.title) + '</a>' +
      (a.original ? '<div class="orig">原題: ' + esc(a.original) + '</div>' : '') +
      (a.summary ? '<p class="sum">' + esc(a.summary) + '</p>' : '') +
      '<div class="words"><b>当たった興味ワード</b> ' + esc(a.words || a.tags || 'なし') + '</div>' +
      rateRow(a, '興味度', '興味') + rateRow(a, '重要度', '重要') +
      '<div class="acts">' +
        '<button class="skip ' + (a.status === '興味なし' ? 'on' : '') + '" data-s="興味なし">興味なし</button>' +
        '<button class="later ' + (a.status === 'あとで読む' ? 'on' : '') + '" data-s="あとで読む">あとで読む</button>' +
        '<button class="done ' + (a.status === '完了' ? 'on' : '') + '" data-s="完了">読んだ</button>' +
      '</div>' +
    '</article></div>';
}

// ---- 媒体・書き手の評価（サーバーと同じ数え方。仕分けたらその場で数え直す） ----
var repMap = {};
function judge(status, interest){
  if (status === '興味なし' || (interest && interest <= 2)) return -1;
  if (status === 'あとで読む' || status === '完了' || interest >= 4) return 1;
  return 0;
}
function rate(p, m){ return p + m ? (p - m) / (p + m) : null; }
function finish(o){
  var now = rate(o.rp, o.rm), before = rate(o.plus - o.rp, o.minus - o.rm), all = rate(o.plus, o.minus);
  o.score = all === null ? 0 : all;
  o.trend = now === null ? 'flat' : before === null ? (now > 0 ? 'up' : now < 0 ? 'down' : 'flat')
    : (now - before > 0.2 ? 'up' : now - before < -0.2 ? 'down' : 'flat');
}
// 同じ媒体・同じ人の記事が同じ数字を見るように、1つの入れ物にまとめる
function linkRep(){
  repMap = {};
  items.forEach(function(a){
    a.src = share('媒体:' + a.source, a.src);
    a.who = a.who && a.pkey ? share('人:' + a.pkey, a.who) : null;  // 人×経路ごと
  });
}
function share(key, o){
  if (!repMap[key]) repMap[key] = o || { plus: 0, minus: 0, rp: 0, rm: 0, score: 0, trend: 'flat' };
  return repMap[key];
}
function adjust(o, sign, d){
  if (!o || !sign) return;
  if (sign > 0) { o.plus += d; o.rp += d; } else { o.minus += d; o.rm += d; }  // 今の仕分けは「最近」に入る
  finish(o);
}
function rejudge(a, beforeStatus, beforeInterest){
  var s0 = judge(beforeStatus, beforeInterest), s1 = judge(a.status, a.interest);
  if (s0 === s1) return;
  [a.src, a.who].forEach(function(o){ adjust(o, s0, -1); adjust(o, s1, 1); });
  refreshBadges(a);
}
function repBadge(o, kind){
  if (!o || !(o.plus + o.minus)) return '<span class="rep mid" title="' + kind + 'の評価はまだありません">' + kind + ' 新</span>';
  var cls = o.score > 0.2 ? 'good' : o.score < -0.2 ? 'bad' : 'mid';
  var arrow = o.trend === 'up' ? '↗' : o.trend === 'down' ? '↘' : '→';
  var tip = kind + 'の評価: プラス' + o.plus + '・マイナス' + o.minus + '（矢印は最近2週間の変化）';
  return '<span class="rep ' + cls + '" title="' + tip + '"><i>' + arrow + '</i>' + kind + ' +' + o.plus + ' −' + o.minus + '</span>';
}
// 同じ媒体・人のカードのバッジだけ書き換える（並びや位置は動かさない）
function refreshBadges(a){
  items.forEach(function(b){
    if (b.src !== a.src && !(a.who && b.who === a.who)) return;
    var s = slotOf(b.id); if (!s) return;
    var tmp = document.createElement('div'); tmp.innerHTML = cardHtml(b);
    var fresh = tmp.firstChild;
    ['.meta', '.by'].forEach(function(sel){
      var o = s.querySelector(sel), n = fresh.querySelector(sel);
      if (o && n) o.innerHTML = n.innerHTML;
    });
  });
}

function suggestHtml(){
  if (!suggest || view !== 'authors') return '';
  var yes = suggest.type === 'ミュート' ? 'ミュートする' : suggest.type === '量を絞る' ? '1日1本にする' : suggest.type === 'フィードに足す' ? 'フィードに足す' : '注目にする';
  return '<div class="slot suggest" data-id="__suggest"><div class="under"><span class="l">' + yes + '</span><span class="r">今はしない</span></div>' +
    '<article class="card"><div class="sg-head">提案 ・ ' + esc(suggest.person) + ' × ' + esc(suggest.ch) + '</div>' +
    '<p class="sg-text">' + esc(suggest.reason) + '</p>' +
    '<div class="acts"><button data-sg="no">今はしない</button><button class="sg-yes" data-sg="yes">' + yes + '</button></div>' +
    '<p class="sg-hint">今はしない を押すと、30日は聞きません</p></article></div>';
}
function answerSuggest(yes, dir){
  var sg = suggest; if (!sg) return;
  suggest = null;
  removeCard('__suggest', dir);
  var feed = sg.type === 'フィードに足す';
  toast(!yes ? '30日は聞きません' : feed ? sg.person + 'をフィードに足しました（次の取得から新着に出ます）' : sg.person + '（' + sg.ch + '）を「' + sg.type + '」にしました', false);
  showCounts();
  // 著者の一覧だけ、フラグを反映するため裏で読み直す（新着は読み直さない）
  var run = google.script.run.withSuccessHandler(function(){ if (yes && !feed && view === 'authors') load(); })
    .withFailureHandler(function(e){ toast('保存できませんでした: ' + e.message, false); });
  if (yes && feed) run.apiAddChannelFeed(USER, sg.person, sg.channelId);
  else run.apiSetAuthor(USER, sg.person, yes ? 'flag' : 'snooze', yes ? sg.type : '', sg.ch);
}

// ---- 著者タブ ----
var FLAG_CLS = { '注目': 'f-focus', '量を絞る': 'f-less', 'ミュート': 'f-mute' };
function strip(c){
  return c.months.map(function(m){
    var cls = !m.n ? 'z' : m.p > m.m ? 'g' : m.m > m.p ? 'r' : 'n';
    var lv = Math.min(3, Math.ceil((m.p + m.m || m.n) / 3));
    return '<i class="' + cls + ' l' + lv + '" title="' + m.n + '本 +' + m.p + ' −' + m.m + '"></i>';
  }).join('');
}
function authorHtml(x){
  var d = authorData;
  var rows = d.channels.filter(function(ch){ return x.ch[ch]; }).map(function(ch){
    var c = x.ch[ch], f = x.flags[ch] || 'ふつう';
    var arrow = c.trend === 'up' ? '↗' : c.trend === 'down' ? '↘' : '→';
    var j = c.plus + c.minus;
    var tone = !j ? 'mid' : c.score > 0.2 ? 'good' : c.score < -0.2 ? 'bad' : 'mid';
    return '<div class="arow"><span class="ach">' + ch + '</span><span class="strip">' + strip(c) + '</span>' +
      '<span class="rep ' + tone + '"><i>' + arrow + '</i>' + (j ? '+' + c.plus + ' −' + c.minus : c.n + '本') + '</span>' +
      '<select data-flag="' + esc(ch) + '" class="' + (FLAG_CLS[f] || '') + '">' + d.flags.map(function(o){ return '<option' + (o === f ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select></div>';
  }).join('');
  if (x.views) {
    rows += '<div class="arow"><span class="ach">視聴</span><span class="strip">' + x.views.months.map(function(n){
      return '<i class="v l' + Math.min(3, Math.ceil(n / 4)) + (n ? '' : ' z') + '" title="' + n + '本"></i>'; }).join('') + '</span>' +
      '<span class="rep vw">' + x.views.recent + '本/3か月</span>' + (x.views.subscribed ? '' : '<span class="nofeed">未登録</span>') + '</div>';
  }
  var open = openAuthor === x.name;
  var detail = !open ? '' : '<div class="adetail">' +
    (x.likes.length ? '<p><b>刺さるテーマ</b> ' + esc(x.likes.join('・')) + '</p>' : '') +
    (x.dislikes.length ? '<p><b>刺さらないテーマ</b> ' + esc(x.dislikes.join('・')) + '</p>' : '') +
    (x.evidence.length ? '<p><b>刺さった記事・動画</b></p><ul>' + x.evidence.map(function(e){ return '<li><a href="' + esc(e.link) + '" target="_blank" rel="noopener">' + esc(e.title) + '</a> <small>' + esc(e.ch) + '</small></li>'; }).join('') + '</ul>' : '') +
    '<label>見方（自分の言葉で。空なら自動の文を使います）<textarea data-manual rows="2">' + esc(x.manual) + '</textarea></label>' +
    '<label>別名（表記ゆれ。読点で区切る）<input data-aliases value="' + esc(x.aliases.join('、')) + '"></label>' +
    '<p class="auto">自動の見方: ' + esc(x.auto) + '</p><button data-save>保存</button></div>';
  return '<article class="card author' + (open ? ' open' : '') + '" data-name="' + esc(x.name) + '">' +
    '<div class="ahead"><b>' + esc(x.name) + '</b>' + (x.pinned ? '<span class="pin">自分で追加</span>' : '') + '<span class="more">' + (open ? '閉じる' : '詳しく') + '</span></div>' +
    '<p class="aview">' + esc(x.view) + '</p>' + rows + detail + '</article>';
}
function renderAuthors(){
  var d = authorData;
  if (!d || !d.items.length) { $('list').innerHTML = '<div class="empty">まだ著者がいません。仕分けやURLの貼り付けを続けると出てきます</div>'; return; }
  var m = d.months.map(function(x){ return Number(x.slice(5)); });
  $('list').innerHTML = suggestHtml() + '<div class="mhead"><span class="ach">月</span><span class="strip">' + m.map(function(x){ return '<em>' + x + '</em>'; }).join('') + '</span></div>' +
    d.items.map(authorHtml).join('');
}
function authorOf(el){ var c = el.closest('.author'); if (!c) return null; var n = c.dataset.name; return authorData.items.filter(function(x){ return x.name === n; })[0]; }

function render(){
  if (view === 'authors') return renderAuthors();
  if (!items.length) {
    $('list').innerHTML = '<div class="empty">' + (view === 'new' ? '未読の記事はありません' : view === 'later' ? '「あとで読む」はありません' : 'まだ評価した記事はありません') + '</div>';
    return;
  }
  $('list').innerHTML = items.map(cardHtml).join('');
}

function find(id){ for (var i = 0; i < items.length; i++) if (items[i].id === id) return i; return -1; }
function slotOf(id){ return document.querySelector('.slot[data-id="' + CSS.escape(id) + '"]'); }

// 件数の付け替え（画面の数字だけ。サーバーは次に開いたとき正しい数を返す）
function countMove(from, to, sign){
  var k = function(s){ return s === '未読' || s === '' ? 'new' : s === 'あとで読む' ? 'later' : null; };
  if (k(from)) counts[k(from)] -= sign; if (k(to)) counts[k(to)] += sign;
  showCounts();
}

// 今の画面から外れるか（新着で あとで/興味なし/読んだ、あとでで 興味なし/読んだ/未読）
function leavesView(status){
  if (view === 'new') return status !== '未読';
  if (view === 'later') return status !== 'あとで読む';
  return false;
}

/** 仕分け。画面はすぐ動かし、保存はうしろで送る（続けてスワイプしても1回にまとめて送る）。 */
function triage(a, status, dir, auto){
  var prev = { status: a.status, interest: a.interest, importance: a.importance };
  var interest = null, importance = null;
  if (status === '興味なし' && !a.interest) { interest = 1; }          // 学習で重みが下がるよう最低点を付ける
  if (prev.status === '興味なし' && status !== '興味なし' && prev.interest === 1) { interest = ''; }
  if (auto && auto.interest && !a.interest) interest = auto.interest;
  if (auto && auto.importance && !a.importance) importance = auto.importance;
  a.status = status;
  if (interest !== null) a.interest = interest === '' ? 0 : interest;
  if (importance !== null) a.importance = importance;
  countMove(prev.status, status, 1);
  rejudge(a, prev.status, prev.interest);
  var index = find(a.id);
  var label = status === '興味なし' ? '興味なしにしました'
    : status === 'あとで読む' ? 'あとで読むへ'
    : status === '完了' && importance !== null ? '興味あり・読まないで片付けました（興味' + a.interest + '・重要' + a.importance + '）'
    : status === '完了' ? '読んだにしました' : '未読に戻しました';
  var leaves = leavesView(status);
  if (leaves) { removeCard(a.id, dir); items.splice(index, 1); }
  else { var s = slotOf(a.id); if (s) s.outerHTML = cardHtml(a); }
  lastMove = { a: a, index: index, prev: prev, left: leaves };
  toast(label, true);
  queueSave({ row: a.row, id: a.id, status: status, interest: interest, importance: importance }, function(){
    // 保存できなかったときだけ、カードを元の場所に戻す
    var s0 = a.status, i0 = a.interest;
    countMove(prev.status, a.status, -1);
    a.status = prev.status; a.interest = prev.interest; a.importance = prev.importance; rejudge(a, s0, i0);
    if (leaves && find(a.id) === -1) { items.splice(Math.min(index, items.length), 0, a); }
    render();
  });
}

// 保存の列。送っている間に来た仕分けはためておき、終わったらまとめて1回で送る。
// 一時的な失敗は1回だけ送り直す（画面は動かさない）。
var saveQ = [], saving = false;
function queueSave(op, onFail){ saveQ.push({ op: op, onFail: onFail, tries: 0 }); flushSaves(); }
function flushSaves(){
  if (saving || !saveQ.length) return;
  saving = true;
  var batch = saveQ.splice(0, saveQ.length);
  google.script.run.withSuccessHandler(function(failed){
    saving = false;
    (failed || []).forEach(function(f){
      batch.filter(function(x){ return x.op.id === f.id; }).forEach(function(x){ x.onFail && x.onFail(); });
      toast('保存できませんでした: ' + f.reason, false);
    });
    flushSaves();
  }).withFailureHandler(function(e){
    saving = false;
    var retry = batch.filter(function(x){ return x.tries < 1; });
    batch.filter(function(x){ return x.tries >= 1; }).forEach(function(x){ x.onFail && x.onFail(); });
    if (retry.length < batch.length) toast('保存できませんでした: ' + e.message, false);
    retry.forEach(function(x){ x.tries++; });
    saveQ = retry.concat(saveQ);
    setTimeout(flushSaves, 1500);
  }).apiTriageBatch(USER, batch.map(function(x){ return x.op; }));
}

function undo(){
  var m = lastMove; if (!m) return; lastMove = null;
  $('toast').classList.remove('show');
  var a = m.a, nowStatus = a.status;
  var interest = m.prev.interest === a.interest ? null : (m.prev.interest || '');
  var importance = m.prev.importance === a.importance ? null : (m.prev.importance || '');
  var i0 = a.interest;
  a.status = m.prev.status; a.interest = m.prev.interest; a.importance = m.prev.importance;
  rejudge(a, nowStatus, i0);
  countMove(nowStatus, m.prev.status, 1);
  if (m.left && find(a.id) === -1) items.splice(Math.min(m.index, items.length), 0, a);
  render();
  var s = slotOf(a.id); if (s) s.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  queueSave({ row: a.row, id: a.id, status: m.prev.status, interest: interest, importance: importance }, function(){ load(); });
}
$('undo').addEventListener('click', undo);

// URLを貼る
$('addBtn').addEventListener('click', function(){
  var f = $('addForm'); f.hidden = !f.hidden;
  if (!f.hidden) {
    $('addUrl').focus();
    // クリップボードにURLがあれば入れておく（許可されないときは何もしない）
    try { navigator.clipboard.readText().then(function(t){ if (/^https?:\/\//.test(t.trim()) && !$('addUrl').value) $('addUrl').value = t.trim(); }).catch(function(){}); } catch (e) {}
  }
});
$('addForm').addEventListener('submit', function(ev){
  ev.preventDefault();
  var url = $('addUrl').value.trim(); if (!url) return;
  $('addGo').disabled = true; $('addGo').textContent = '読み込み中…';
  google.script.run.withSuccessHandler(function(r){
    $('addGo').disabled = false; $('addGo').textContent = '追加';
    $('addUrl').value = ''; $('addForm').hidden = true;
    toast((r.existed ? '印を付け直しました: ' : '追加しました: ') + r.title.slice(0, 14) + (r.added.length ? '／注目に ' + r.added.join('・') : ''), false);
    if (view === 'rated') load();
  }).withFailureHandler(function(e){
    $('addGo').disabled = false; $('addGo').textContent = '追加';
    toast('追加できませんでした: ' + e.message, false);
  }).apiAddUrl(USER, url);
});

function removeCard(id, dir){
  var slot = slotOf(id); if (!slot) return;
  var card = slot.querySelector('.card');
  card.classList.add('anim');
  card.style.transform = 'translateX(' + (dir === 'left' ? '-' : '') + '110%)';
  slot.style.height = slot.offsetHeight + 'px';
  requestAnimationFrame(function(){
    slot.style.height = '0px'; slot.style.marginBottom = '-12px'; slot.style.opacity = '0';
  });
  setTimeout(function(){ if (slot.parentNode) slot.parentNode.removeChild(slot); if (!items.length) render(); }, 240);
}

// ボタン（スワイプできない人・PC向け）
$('list').addEventListener('click', function(ev){
  if (view === 'authors') {
    var sgb = ev.target.closest('button[data-sg]');
    if (sgb) { answerSuggest(sgb.dataset.sg === 'yes', sgb.dataset.sg === 'yes' ? 'right' : 'left'); return; }
    var x = authorOf(ev.target); if (!x) return;
    if (ev.target.closest('select,textarea,input,a')) return;
    if (ev.target.closest('[data-save]')) {
      var card = ev.target.closest('.author');
      var manual = card.querySelector('[data-manual]').value.trim(), aliases = card.querySelector('[data-aliases]').value.trim();
      x.manual = manual; x.view = manual || x.auto; x.aliases = aliases ? aliases.split(/[,、]/).map(function(t){ return t.trim(); }).filter(String) : [];
      openAuthor = ''; renderAuthors(); toast('保存しました', false);
      google.script.run.withSuccessHandler(function(){
        google.script.run.withFailureHandler(function(e){ toast('保存できませんでした: ' + e.message, false); }).apiSetAuthor(USER, x.name, 'aliases', aliases, '');
      }).withFailureHandler(function(e){ toast('保存できませんでした: ' + e.message, false); }).apiSetAuthor(USER, x.name, 'manual', manual, '');
      return;
    }
    if (ev.target.closest('.ahead,.aview')) { openAuthor = openAuthor === x.name ? '' : x.name; renderAuthors(); }
    return;
  }
  var b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.sg) { answerSuggest(b.dataset.sg === 'yes', b.dataset.sg === 'yes' ? 'right' : 'left'); return; }
  var slot = b.closest('.slot'); var a = items[find(slot.dataset.id)]; if (!a) return;
  if (b.dataset.f) {
    var key = b.dataset.f === '興味度' ? 'interest' : 'importance';
    var before = a[key], v = Number(b.dataset.v);
    var ib = a.interest;
    a[key] = before === v ? 0 : v;  // 同じ数字をもう一度押すと取り消し
    if (key === 'interest') rejudge(a, a.status, ib);
    b.parentNode.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', Number(x.dataset.v) === a[key]); });
    google.script.run.withSuccessHandler(function(){})
      .withFailureHandler(function(e){ a[key] = before; render(); toast('保存できませんでした: ' + e.message, false); })
      .apiRate(USER, a.row, a.id, b.dataset.f, a[key] || '');
  } else if (b.dataset.s) {
    var next = a.status === b.dataset.s ? '未読' : b.dataset.s;
    triage(a, next, next === '興味なし' ? 'left' : 'right');
  }
});

// 著者のフラグを変える（すぐ反映、保存は裏）
$('list').addEventListener('change', function(ev){
  var sel = ev.target.closest('select[data-flag]'); if (!sel) return;
  var x = authorOf(sel); var ch = sel.dataset.flag, before = x.flags[ch] || 'ふつう';
  x.flags[ch] = sel.value; sel.className = FLAG_CLS[sel.value] || '';
  toast(x.name + '（' + ch + '）を「' + sel.value + '」にしました', false);
  google.script.run.withSuccessHandler(function(){})
    .withFailureHandler(function(e){ x.flags[ch] = before; renderAuthors(); toast('保存できませんでした: ' + e.message, false); })
    .apiSetAuthor(USER, x.name, 'flag', sel.value, ch);
});

// スワイプ。縦のスクロールは邪魔しない（はっきり横に動いたと分かってから動かす）
// ・ボタンやリンクの上から始めてもスワイプできる（動かしたら押したことにしない）
// ・決まる位置を越えると色が濃くなり、文字が大きくなる（Androidは軽く振動）。戻せば取り消し
(function(){
  var st = null;
  var list = $('list');
  function threshold(slot){ return Math.max(72, Math.min(140, slot.offsetWidth * 0.25)); }
  list.addEventListener('touchstart', function(ev){
    if (!SWIPE[view] || ev.touches.length !== 1) return;
    if (ev.target.closest('select,textarea,input')) return;
    var slot = ev.target.closest('.slot'); if (!slot) return;
    var t = ev.touches[0];
    st = { slot: slot, card: slot.querySelector('.card'), x: t.clientX, y: t.clientY, dx: 0, mode: null,
           t: Date.now(), lastX: t.clientX, lastT: Date.now(), v: 0, armed: false, th: threshold(slot) };
  }, { passive: true });
  list.addEventListener('touchmove', function(ev){
    if (!st) return;
    var t = ev.touches[0], dx = t.clientX - st.x, dy = t.clientY - st.y;
    if (!st.mode) {
      // 斜めの指の動きはスクロール扱い。横は縦の2倍以上動いたときだけ
      if (Math.abs(dx) < 14 && Math.abs(dy) < 10) return;
      st.mode = Math.abs(dx) >= 14 && Math.abs(dx) > Math.abs(dy) * 2 ? 'x' : 'y';
      if (st.mode === 'x') st.card.classList.remove('anim');
      if (st.mode === 'y') { st = null; return; }
    }
    ev.preventDefault();
    var now = Date.now();
    st.v = (t.clientX - st.lastX) / Math.max(1, now - st.lastT); st.lastX = t.clientX; st.lastT = now;
    st.dx = dx;
    st.card.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 60) + 'deg)';
    st.slot.classList.toggle('toR', dx > 0); st.slot.classList.toggle('toL', dx < 0);
    st.slot.classList.toggle('done', view === 'later');
    var armed = Math.abs(dx) >= st.th;
    if (armed !== st.armed) {
      st.armed = armed; st.slot.classList.toggle('armed', armed);
      if (armed && navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
    }
  }, { passive: false });
  function end(){
    if (!st) return;
    var s = st; st = null;
    if (s.mode !== 'x') return;
    swiped = true; setTimeout(function(){ swiped = false; }, 450);
    // 決まる位置を越えて離す、または同じ向きに素早くはじく（戻しかけている途中は決めない）
    var flick = Math.abs(s.dx) > 50 && Math.abs(s.v) > 0.6 && (s.v > 0) === (s.dx > 0);
    var go = s.armed || flick;
    s.slot.classList.remove('armed');
    if (!go) {
      s.card.classList.add('anim'); s.card.style.transform = '';
      setTimeout(function(){ s.slot.classList.remove('toL', 'toR'); }, 200);
      return;
    }
    var dir = s.dx > 0 ? 'right' : 'left';
    if (s.slot.dataset.id === '__suggest') { answerSuggest(dir === 'right', dir); return; }
    var a = items[find(s.slot.dataset.id)]; if (!a) return;
    var conf = SWIPE[view][dir];
    triage(a, conf.status, dir, conf);
  }
  list.addEventListener('touchend', end);
  list.addEventListener('touchcancel', function(){
    if (!st) return; var s = st; st = null;
    s.slot.classList.remove('armed', 'toL', 'toR'); s.card.classList.add('anim'); s.card.style.transform = '';
  });
  // スワイプのつもりでリンクやボタンに触れていたときは、押したことにしない
  list.addEventListener('click', function(ev){
    if (swiped && ev.target.closest('a,button')) { ev.preventDefault(); ev.stopPropagation(); swiped = false; }
  }, true);
})();

document.querySelectorAll('nav button').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('nav button').forEach(function(x){ x.classList.toggle('on', x === b); });
    view = b.dataset.v; load();
  });
});
load();
</script>
