[GSPREAD]
# The path to your Google Cloud service account JSON key file.
# This file is required to authenticate with the Google Sheets API.
# Example: /path/to/your/credentials.json
# If the file is in the same directory as the script, you can just use the filename.
SERVICE_ACCOUNT_FILE = credentials.json

# The name of the Google Sheet document you want to use.
# The script will create it if it doesn't exist.
SHEET_NAME = RSS_Feed_History

[NTFY]
# The ntfy.sh topic to publish notifications to.
# Choose a long, random, unguessable string for your topic name.
# You will subscribe to this topic in the ntfy mobile app.
# Example: my-secret-rss-alerts-f92jd0
TOPIC = your-ntfy-topic

[RSS_FEEDS]
# A list of RSS feed URLs to check.
# Add each URL on a new line, indented.
URLS =
    https://example.com/rss/feed1.xml
    https://anotherexample.com/feed
