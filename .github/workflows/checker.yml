# Name of the workflow, as it will appear in the "Actions" tab of the GitHub repository.
name: RSS to Notion AI Sync

on:
  schedule:
    # Runs every 6 hours. You can adjust this schedule.
    - cron: '0 */6 * * *'

  # Allows manual runs from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-notion:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      # The `clean: true` parameter ensures that the workspace is cleared
      # before checking out the code, preventing stale file issues.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      # Step 2: Set up the Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Step 4: Run the main Python script
      # Securely passes secrets from GitHub to the script as environment variables.
      - name: Run RSS to Notion Sync script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python src/main.py
