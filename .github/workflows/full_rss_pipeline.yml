    1 name: Full RSS Pipeline
    2 
    3 on:
    4   schedule:
    5     - cron: '0 */6 * * *'  # 6時間ごと
    6   workflow_dispatch:
    7 
    8 jobs:
    9   full_pipeline:
   10     runs-on: ubuntu-latest
   11     steps:
   12       - uses: actions/checkout@v3
   13 
   14       - name: Set up Python
   15         uses: actions/setup-python@v4
   16         with:
   17           python-version: "3.11"
   18 
   19       - name: Install dependencies
   20         run: |
   21           python -m pip install --upgrade pip
   22           pip install -r requirements.txt
   23 
   24       - name: Consolidate Sources
   25         run: python src/consolidate_sources.py
   26 
   27       - name: Fetch and Enrich Articles
   28         env:
   29           GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
   30         run: python src/fetch_and_enrich_articles.py
   31 
   32       - name: Calculate Priority Scores
   33         run: python src/calculate_priority_scores.py
   34 
   35       - name: Push to Notion
   36         env:
   37           NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
   38           NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
   39           NOTION_SUGGESTIONS_PAGE_ID: ${{ secrets.NOTION_SUGGESTIONS_PAGE_ID }}
   40         run: python src/push_recommendations_to_notion.py