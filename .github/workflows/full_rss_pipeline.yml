name: Full RSS Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'  # 6時間ごとに実行
  workflow_dispatch:       # 手動実行可能

jobs:
  rss_to_notion:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      NOTION_SUGGESTIONS_PAGE_ID: ${{ secrets.NOTION_SUGGESTIONS_PAGE_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Consolidate sources
        run: python src/consolidate_sources.py

      - name: Fetch and enrich articles
        run: python src/fetch_and_enrich_articles.py

      - name: Push recommendations to Notion
        run: python src/push_recommendations_to_notion.py

      - name: Calculate priority scores
        run: python src/calculate_priority_scores.py

      - name: Commit updated data files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*
          git commit -m "Update consolidated and enriched data" || echo "No changes to commit"
          git push
