name: Full RSS Pipeline

on:
  schedule:
    - cron: '0 6 * * *' # 毎朝6時に実行
  workflow_dispatch: # 手動実行も可能

jobs:
  full_pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Consolidate sources
        run: |
          python src/consolidate_sources.py

      - name: Push recommendations to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_SUGGESTIONS_PAGE_ID: ${{ secrets.NOTION_SUGGESTIONS_PAGE_ID }}
        run: |
          python src/push_recommendations_to_notion.py

      - name: Fetch new articles and enrich
        run: |
          python src/fetch_and_enrich_articles.py

      - name: Calculate priority scores
        run: |
          python src/calculate_priority_scores.py

      - name: Commit updated data files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/*.json
          git commit -m "Update consolidated data and scores [Automated]" || echo "No changes to commit"
          git push
