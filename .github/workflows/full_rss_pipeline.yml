name: Full RSS Pipeline

on:
  workflow_dispatch:   # 手動実行用
  schedule:
    - cron: '0 */6 * * *'  # 6時間ごとに自動実行（UTC）

jobs:
  rss_pipeline:
    runs-on: ubuntu-latest
    steps:
      # 1. リポジトリをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Python 環境セットアップ
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3. 依存関係のインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. consolidated_sources.json から記事取得・加工
      - name: Fetch and Enrich Articles
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python src/fetch_and_enrich_articles.py

      # 5. 優先度スコア計算
      - name: Calculate Priority Scores
        run: |
          python src/calculate_priority_scores.py

      # 6. Notion にプッシュ
      - name: Push Recommendations to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_SUGGESTIONS_PAGE_ID: ${{ secrets.NOTION_SUGGESTIONS_PAGE_ID }}
        run: |
          python src/push_recommendations_to_notion.py

      # 7. 記事・スコアのコミット
      - name: Commit updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          git add data/consolidated_sources.json
          git commit -m "Update articles and priority scores" || echo "No changes to commit"
          git push
