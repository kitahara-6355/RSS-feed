# .github/workflows/full_rss_pipeline.yml
name: Full RSS Pipeline

on:
  schedule:
    # 毎日6時に実行
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  rss_pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Consolidate Sources
        run: python src/consolidate_sources.py

      - name: Push Recommendations to Notion
        run: python src/push_recommendations_to_notion.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_SUGGESTIONS_PAGE_ID: ${{ secrets.NOTION_SUGGESTIONS_PAGE_ID }}

      - name: Fetch & Enrich Articles
        run: python src/fetch_and_enrich_articles.py
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Calculate Priority Scores
        run: python src/calculate_priority_scores.py

      - name: Commit Updated Data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update consolidated sources and enriched articles" || echo "No changes to commit"
          git push
